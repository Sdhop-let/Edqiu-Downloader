# ===== 网盘直连备份：应用资质占位（开发期可留空） =====
# 由 app/build.gradle.kts 读取并注入 BuildConfig（BAIDU_CLIENT_ID 等），
# 代码中通过 .isNotBlank() 检查，未配置时提示「未配置应用资质」。
# 百度开放平台注册应用（https://pan.baidu.com/union）后填入：
BAIDU_CLIENT_ID=
BAIDU_CLIENT_SECRET=
# 阿里云盘开放平台 client_id（非官方 refresh_token 流程所需，社区常用固定值）：
ALI_CLIENT_ID=
ALI_CLIENT_SECRET=
