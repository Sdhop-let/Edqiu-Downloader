# GitHub Release 自动发版（2026-09-30 起）：
# 推送 v* tag → GitHub 服务器构建 debug APK → 创建 Release 并上传资产。
# 本地无需访问 api.github.com（发版动作全部在 GitHub 侧执行）。
# 约定：tag 名 = 版本号（v1.6.9），必须与 app/build.gradle.kts 的 versionName 一致；
# Release 说明自动取 docs/ 下最新的 RELEASE_NOTES-*.md（保证文档与 APK 同步）。
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" > /dev/null || true

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee build-log.txt

      - name: Push build log to ci-logs branch (diagnosis)
        if: failure()
        run: |
          tail -c 300000 build-log.txt > trimmed-log.txt || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-logs "${{ github.sha }}"
          mv trimmed-log.txt build-log.txt
          git add build-log.txt
          git commit -m "ci: build log for run ${{ github.run_id }} [skip ci]"
          git push origin ci-logs

      - name: Show build log tail in run summary (public diagnosis)
        if: failure()
        run: tail -120 build-log.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Pick newest release notes
        run: ls docs/RELEASE_NOTES-*.md | sort -V | tail -1 | xargs -I{} cp {} release-notes.md

      - name: Rename APK with version
        run: cp app/build/outputs/apk/debug/app-debug.apk "Edqiu-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Edqiu ${{ github.ref_name }}
          body_path: release-notes.md
          files: Edqiu-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
