# GitHub Release 自动发版（2026-09-30 起）：
# 推送 v* tag → GitHub 服务器构建 debug APK → 创建 Release 并上传资产。
# 本地无需访问 api.github.com（发版动作全部在 GitHub 侧执行）。
# 约定：tag 名 = 版本号（v1.6.9），必须与 app/build.gradle.kts 的 versionName 一致；
# Release 说明自动取 docs/ 下最新的 RELEASE_NOTES-*.md（保证文档与 APK 同步）。
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Pick newest release notes
        run: ls docs/RELEASE_NOTES-*.md | sort -V | tail -1 | xargs -I{} cp {} release-notes.md

      - name: Rename APK with version
        run: cp app/build/outputs/apk/debug/app-debug.apk "Edqiu-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Edqiu ${{ github.ref_name }}
          body_path: release-notes.md
          files: Edqiu-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
